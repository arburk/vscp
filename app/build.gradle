plugins {
  id 'com.android.application'
  id 'jacoco'
  id "org.sonarqube" version "7.3.1.8318"
  id("de.mannodermaus.android-junit5") version "2.0.1"
}

// The git tag is the single source of truth for the version: the release workflow passes
// -PversionName=<tag without the leading v>. Local builds fall back to a snapshot version.
def appVersionName = providers.gradleProperty('versionName').getOrElse('0.0.1-SNAPSHOT')

// Strictly monotonic and derived from the version name: 1.2.0 -> 1002000. Pre-release
// suffixes are cut off, so v1.2.0-rc1 and v1.2.0 share the same code - publish only one.
static int versionCodeOf(String name) {
  def parts = name.replaceAll('-.*$', '').tokenize('.')
  if (parts.size() != 3) {
    throw new GradleException("versionName '$name' is not MAJOR.MINOR.PATCH[-qualifier]")
  }
  parts[0].toInteger() * 1_000_000 + parts[1].toInteger() * 1_000 + parts[2].toInteger()
}

// Set by the release workflow after it has decoded the keystore secret. Without it the
// release build stays unsigned instead of failing, so local builds work without secrets.
def keystorePath = System.getenv('KEYSTORE_FILE')

android {
  namespace = 'com.github.arburk.vscp.app'
  compileSdk 37

  defaultConfig {
    applicationId "com.github.arburk.vscp.app"
    minSdk 25
    targetSdk 35
    versionCode versionCodeOf(appVersionName)
    versionName appVersionName

    // Make sure to use the AndroidJUnitRunner (or a sub-class) in order to hook in the JUnit 5 Test Builder
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    testInstrumentationRunnerArguments["runnerBuilder"] = "de.mannodermaus.junit5.AndroidJUnit5Builder"
    testInstrumentationRunnerArguments["configurationParameters"] = "junit.jupiter.execution.parallel.enabled=true,junit.jupiter.execution.parallel.mode.default=concurrent"
  }

  signingConfigs {
    release {
      if (keystorePath) {
        storeFile file(keystorePath)
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS')
        keyPassword System.getenv('KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      debuggable false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // Wired conditionally: an empty signingConfig fails validateSigningRelease.
      if (keystorePath) {
        signingConfig signingConfigs.release
      }
    }
    debug {
      debuggable true
      enableUnitTestCoverage = true
      enableAndroidTestCoverage = true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    viewBinding = true
  }

  testOptions {

    unitTests {
      returnDefaultValues = true
      includeAndroidResources = true
      all {
        useJUnitPlatform()
        jacoco {
          jacoco.includeNoLocationClasses = true
          jacoco.excludes = ['jdk.internal.*']
        }
        jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
      }
    }

    managedDevices {
      localDevices {
        nexus5api27 {
          device = "Nexus 5"
          apiLevel = 27
          systemImageSource = "aosp"
        }
        nexus5api28 {
          device = "Nexus 5"
          apiLevel = 28
          systemImageSource = "aosp"
        }
        pixel3api29 {
          device = "Pixel 3"
          apiLevel = 29
          // No ATD image exists for API 29, so the plain AOSP one is used
          systemImageSource = "aosp"
        }
        pixel3api30 {
          device = "Pixel 3"
          apiLevel = 30
          // Also use the AOSP Automated Test Device image for better emulator performance
          systemImageSource = "aosp-atd"
        }
        pixel4api31 {
          device = "Pixel 4"
          apiLevel = 31
          systemImageSource = "aosp-atd"
        }
        pixel4api32 {
          device = "Pixel 4"
          apiLevel = 32
          systemImageSource = "aosp-atd"
        }
        pixel6api33 {
          device = "Pixel 6"
          apiLevel = 33
          // Also use the AOSP Automated Test Device image for better emulator performance
          systemImageSource = "aosp-atd"
        }
        pixel6api34 {
          device = "Pixel 6"
          apiLevel = 34
          systemImageSource = "aosp-atd"
        }
        pixel6api35 {
          device = "Pixel 6"
          apiLevel = 35
          systemImageSource = "aosp-atd"
        }
        pixel6api36 {
          device = "Pixel 6"
          apiLevel = 36
          systemImageSource = "aosp-atd"
        }
        pixel6api37 {
          device = "Pixel 6"
          apiLevel = 37
          // API 37 ships no AOSP/ATD image, only the Google APIs one - and that one is
          // published as 'system-images;android-37.0;google_apis;...'. ManagedVirtualDevice
          // has no minor-version field, so apiLevel = 37 resolves to a package that does
          // not exist. API 37 is covered by the emulator-runner job in CI instead.
          systemImageSource = "google"
          // AGP cannot derive the page size for API 37 yet and warns on every build.
          // The app has no native code, so the 4 kb image it would pick anyway is fine.
          pageAlignment = com.android.build.api.dsl.ManagedVirtualDevice.PageAlignment.FORCE_4KB_PAGES
        }
      }
      groups {
        supportedSdks {
          targetDevices.add(localDevices.nexus5api27)
          targetDevices.add(localDevices.nexus5api28)
          targetDevices.add(localDevices.pixel3api29)
          targetDevices.add(localDevices.pixel3api30)
          targetDevices.add(localDevices.pixel4api31)
          targetDevices.add(localDevices.pixel4api32)
          targetDevices.add(localDevices.pixel6api33)
          targetDevices.add(localDevices.pixel6api34)
          targetDevices.add(localDevices.pixel6api35)
          targetDevices.add(localDevices.pixel6api36)
          // pixel6api37 is left out on purpose - see the comment on that device above
        }
      }
    }
  }

  packaging {
    resources {
      excludes += [
          'META-INF/DEPENDENCIES',
          'META-INF/LICENSE*.*',
          'META-INF/NOTICE*.*',
          'META-INF/notice.txt',
          'META-INF/ASL2.0',
          'META-INF/LGPL2.1',
          'META-INF/AL2.0',
          'META-INF/*.kotlin_module',
      ]
    }
  }
}

sonar {
  properties {
    property "sonar.projectKey", "arburk_vscp"
    property "sonar.organization", "arburk"
    property "sonar.host.url", "https://sonarcloud.io"
    // The report comes from the custom jacocoTestReport task below, not from the
    // default location the Sonar plugin would guess, so point at it explicitly.
    property "sonar.coverage.jacoco.xmlReportPaths",
        layout.buildDirectory.file("reports/jacoco/jacocoTestReport/jacocoTestReport.xml").get().asFile
    property "sonar.junit.reportPaths",
        layout.buildDirectory.dir("test-results/testDebugUnitTest").get().asFile
  }
}

jacoco {
  toolVersion = "0.8.15"
}

tasks.register('jacocoTestReport', JacocoReport) {
  dependsOn(testDebugUnitTest)

  reports {
    xml.getRequired().set(true)
    html.getRequired().set(true)
  }

  def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
  // Ask the compile tasks for their output dirs instead of hard-coding intermediate
  // paths - those moved with AGP 9 (javac/<variant>/<task>/classes, built_in_kotlinc/...).
  def compiledClasses = files(
      tasks.named('compileDebugJavaWithJavac').map { it.destinationDirectory },
      tasks.named('compileDebugKotlin').map { it.destinationDirectory }
  )

  sourceDirectories.setFrom(files(["${project.projectDir}/src/main/java"]))
  classDirectories.setFrom(compiledClasses.asFileTree.matching { exclude fileFilter })
  executionData.setFrom(fileTree(dir: "$projectDir/build", includes: [
      "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
      "outputs/managed_device_code_coverage/**/coverage.ec",
      // connectedCheck against a real device or the emulator-runner in CI
      "outputs/code_coverage/debugAndroidTest/connected/**/coverage.ec",
  ]))
}

// The CI job lists both tasks on one command line, which does not by itself
// guarantee the report exists before the scanner reads it.
tasks.named('sonar') {
  dependsOn(tasks.named('jacocoTestReport'))
}

dependencies {
  implementation 'androidx.core:core-ktx:1.19.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.14.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
  implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
  implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
  implementation 'androidx.preference:preference:1.2.1'
  implementation 'androidx.activity:activity-ktx:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'

  // If using JUnit Jupiter
  testImplementation "org.junit.jupiter:junit-jupiter:$junitJupiterVersion"
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation "org.mockito:mockito-core:5.23.0"
  testImplementation "org.awaitility:awaitility:4.3.0"

  androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
  androidTestImplementation 'com.github.tmurakami:dexopener:2.0.5'
  // Android Instrumentation Tests wth JUnit 5. Kept on 5.x on purpose: the JUnit 6
  // runner refuses to run below API 35, JUnit 5 works from API 26 upwards.
  androidTestImplementation "org.junit.jupiter:junit-jupiter-api:$junitJupiterAndroidVersion"
  androidTestImplementation "org.junit.jupiter:junit-jupiter-params:$junitJupiterAndroidVersion"
  // android-test-core/-runner are added by the android-junit5 plugin, which picks the
  // flavour matching the jupiter version above - declaring them here caused the
  // checkDebugAndroidTestDuplicateClasses failures.
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}