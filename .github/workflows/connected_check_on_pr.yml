name: Instrumented Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'main'


jobs:
  build:
    runs-on: ubuntu-latest # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
    timeout-minutes: 60
    # API 37 only has preview-grade images, so it must not block the PR.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Allow tests to continue on other devices if they fail on one device.
      fail-fast: false
      matrix:
        # api-level doubles as the SDK package suffix: 'platforms;android-<api-level>' and
        # 'system-images;android-<api-level>;<target>;x86_64'. Run `sdkmanager --list` to
        # see what exists before adding a row.
        include:
          - { api-level: '27',   target: default,     experimental: false }
          - { api-level: '28',   target: google_apis, experimental: false }
          - { api-level: '29',   target: google_apis, experimental: false }
          - { api-level: '30',   target: aosp_atd,    experimental: false }
          - { api-level: '31',   target: aosp_atd,    experimental: false }
          - { api-level: '32',   target: aosp_atd,    experimental: false }
          - { api-level: '33',   target: aosp_atd,    experimental: false }
          - { api-level: '34',   target: aosp_atd,    experimental: false }
          - { api-level: '35',   target: aosp_atd,    experimental: false }
          - { api-level: '36',   target: aosp_atd,    experimental: false }
          # API 37 is published minor-versioned only (platforms;android-37.0,
          # system-images;android-37.0;google_apis) and has no aosp/atd image.
          - { api-level: '37.0', target: google_apis, experimental: true }

    steps:
      - name: checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile app and instrumentation APK before booting the emulator, so a plain
      # compile error fails the job without burning emulator time.
      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM group perms
        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        # Starting on February 23, 2023, Actions users of GitHub-hosted larger Linux runners will be able to make use of hardware acceleration for Android testing
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

## Disable cache since it breaks the tests
#      - name: AVD cache
#        if: steps.check_pr.outputs.PERFORM_TEST != 0
#        uses: actions/cache@v4
#        id: avd-cache
#        with:
#          path: |
#            ~/.android/avd/*
#            ~/.android/adb*
#          key: avd-ubuntu-${{ matrix.api-level }}

      - name: Perform instrumented tests  # see https://github.com/marketplace/actions/android-emulator-runner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -logcat-output ${{ github.workspace }}/app/build/reports/avd${{ matrix.api-level }}.log
          disable-animations: true
          script: ./gradlew connectedCheck

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            **/build/reports/*
            **/build/outputs/*/connected/*
          retention-days: 14
